<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Celebration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="balloon-layer" aria-hidden="true"></div>

    <main class="card" role="main" aria-labelledby="title">
      <p class="tag">🎉 Make a Wish 🎉</p>
      <h1 id="title">Happy Birthday!</h1>
      <p class="message">
        Sending you joy, warm hugs, and sparkly surprises. May this year bring
        amazing memories, sweet moments, and lots of reasons to smile!
      </p>
      <div class="actions">
        <button id="celebrate-btn" type="button">Celebrate Again ✨</button>
        <button id="music-btn" type="button" aria-pressed="false">Play Birthday Song 🎵</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
